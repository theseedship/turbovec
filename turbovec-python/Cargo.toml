[package]
name = "turbovec-python"
version = "0.3.0"
edition = "2021"
rust-version = "1.83"

[lib]
name = "_turbovec"
crate-type = ["cdylib"]

[dependencies]
turbovec-core = { package = "turbovec", path = "../turbovec" }
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py39"] }
numpy = "0.29.0"
